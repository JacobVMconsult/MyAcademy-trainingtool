<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAcademy Trainingen Zoektool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f6f9;color:#1a1a1a;font-size:14px}
.topbar{background:#1F3864;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.logo{font-size:18px;font-weight:700}
.logo span{color:#BDD7EE;font-weight:400;font-size:14px;margin-left:8px}
.topbar-right{font-size:12px;color:#BDD7EE}
#rz{background:#fff;border:2px dashed #2E75B6;border-radius:10px;margin:16px 24px 0;padding:12px 20px;display:flex;align-items:center;gap:14px;transition:all .2s}
#rz.over{background:#E6F1FB;border-color:#1F3864}
#rz input{display:none}
.rz-icon{font-size:22px;flex-shrink:0}
.rz-text{flex:1}
.rz-text strong{display:block;font-size:12px;color:#1F3864}
.rz-text span{font-size:11px;color:#888}
.rz-btn{background:#2E75B6;color:#fff;border:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.rz-btn:hover{background:#1F3864}
.meta{background:#fff;border-bottom:1px solid #dde3ec;padding:8px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11px;color:#888}
#dlbl{background:#f4f6f9;padding:3px 10px;border-radius:20px}
.ctrl{padding:12px 24px 0;display:flex;gap:8px;flex-wrap:wrap}
.ctrl input,.ctrl select{font-size:13px;padding:7px 11px;border:1px solid #ccd4e0;border-radius:8px;background:#fff;color:#1a1a1a;outline:none}
.ctrl input{flex:1;min-width:180px}
.ctrl input:focus,.ctrl select:focus{border-color:#2E75B6}
#stats{padding:8px 24px 0;font-size:12px;color:#666}
#out{padding:10px 24px 24px}
.card{background:#fff;border:1px solid #dde3ec;border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.av{width:38px;height:38px;border-radius:50%;background:#E6F1FB;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#185FA5;flex-shrink:0}
.cn{font-size:15px;font-weight:700;color:#1F3864}
.cs{font-size:11px;color:#888;margin-top:2px}
.vb{font-size:11px;padding:3px 10px;border-radius:20px;white-space:nowrap;align-self:flex-start;flex-shrink:0;font-weight:600}
.pb{border:1px solid #e0e6f0;border-radius:8px;margin-bottom:10px;overflow:hidden}
.ph{background:#1F3864;color:#fff;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;cursor:pointer;user-select:none}
.pt{font-size:13px;font-weight:700}
.pm{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ps{font-size:11px;color:rgba(255,255,255,.8)}
.ps strong{color:#fff}
.pba{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;border:1px solid rgba(255,255,255,.3)}
.cv{font-size:12px;color:rgba(255,255,255,.7);min-width:12px}
.pbd{padding:0}
.pbd.col{display:none}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f0f4f8;color:#555;font-weight:600;padding:7px 10px;text-align:left;border-bottom:1px solid #e0e6f0;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #f0f4f8;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfd}
.tb{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap;border:1px solid}
.tEv{background:#fff3e0;color:#8c5000;border-color:#ffcc80}
.tEL{background:#e3f2fd;color:#0d47a1;border-color:#90caf9}
.tTe{background:#f3e5f5;color:#4a148c;border-color:#ce93d8}
.sp{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;border:1px solid}
.dc{font-size:11px;color:#666;white-space:nowrap}
.hc{font-weight:600;color:#1F3864;text-align:center}
.kok{color:#155724;font-weight:700}
.kbl{color:#004085;font-weight:700}
.kpe{color:#8652cc;font-weight:700}
.kno{color:#999}
.psm{background:#f8fafc;padding:8px 14px;display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid #e0e6f0;font-size:11px;color:#555}
.psm strong{color:#1F3864}
.nr{text-align:center;padding:3rem 1rem;color:#aaa;font-size:14px}
.ov{display:none;position:fixed;inset:0;background:rgba(31,56,100,.7);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#fff;font-size:16px}
.ov.sh{display:flex}
.sp2{width:36px;height:36px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ts{position:fixed;bottom:24px;right:24px;background:#1F3864;color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;z-index:1000;pointer-events:none}
.ts.sh{opacity:1}
</style>
</head>
<body>
<div class="ov" id="ov"><div class="sp2"></div><div id="omsg">Bezig...</div></div>
<div class="ts" id="ts"></div>
<div class="topbar">
  <div class="logo">De Mobiliteitsmakelaar <span>MyAcademy Trainingen Zoektool</span></div>
  <div class="topbar-right" id="tc"></div>
</div>
<div id="rz">
  <input type="file" id="fi" accept=".xlsx,.xls">
  <div class="rz-icon">&#128194;</div>
  <div class="rz-text">
    <strong>Data bijwerken &#8212; sleep een nieuw Excel-rapport hier naartoe</strong>
    <span>Exporteer "Mandatory Learning Tracks Technical Training" uit MyAcademy en sleep het hier</span>
  </div>
  <button class="rz-btn" onclick="document.getElementById('fi').click()">Kies bestand</button>
</div>
<div class="meta">
  <span id="dlbl">Laden...</span>
  <span>&#127891; Event &nbsp; &#128187; e-Learning &nbsp; &#128221; Test</span>
</div>
<div class="ctrl">
  <input type="text" id="sq" placeholder="Zoek op naam, ID, training, programma...">
  <select id="sv"><option value="">Alle vestigingen</option></select>
  <select id="sp"><option value="">Alle programmas</option></select>
  <select id="ss"><option value="">Alle statussen</option></select>
</div>
<div id="stats"></div>
<div id="out"></div>
<script>
var VC={'Autobedrijf Deckx-Team':{bg:'#ddeeff',tx:'#185FA5'},'Garage Verellen Geel':{bg:'#ddf0d0',tx:'#2E6B0F'},'Liers Auto Center':{bg:'#fef0d5',tx:'#8c5000'},'Garage Verschaeren':{bg:'#ede9ff',tx:'#4a2db0'},'Hermans Herentals':{bg:'#fde9df',tx:'#8c3010'},'DE MOBILITEITSMAKELAAR':{bg:'#eeecea',tx:'#555'}};
var SS={'Voltooid':{bg:'#d4edda',tx:'#155724',br:'#a3d7b0'},'Voltooid (Equivalent)':{bg:'#d4edda',tx:'#155724',br:'#a3d7b0'},'Goedgekeurd':{bg:'#cce5ff',tx:'#004085',br:'#8ec5f5'},'Ingeschreven':{bg:'#fff3cd',tx:'#856404',br:'#ffd97d'},'Ingeschreven / Over tijd':{bg:'#ffe5d0',tx:'#7a3200',br:'#ffaa70'},'In behandeling':{bg:'#e2d9f3',tx:'#432874',br:'#b89fe0'},'Niet gestart':{bg:'#f1f1f1',tx:'#666',br:'#ccc'},'Vrijgesteld':{bg:'#d6eaff',tx:'#1a4a7a',br:'#80b4f0'}};
var USERS=[];
function ini(n){var p=(n||'').split(',').map(function(s){return s.trim();});return(((p[1]||'')[0]||'')+((p[0]||'')[0]||'')).toUpperCase()||'?';}
function spill(s){var st=SS[s]||{bg:'#f1f1f1',tx:'#666',br:'#ccc'};return '<span class="sp" style="background:'+st.bg+';color:'+st.tx+';border-color:'+st.br+'">'+(s||'&mdash;')+'</span>';}
function pbadge(s){var st=SS[s]||{bg:'rgba(255,255,255,.15)',tx:'#fff',br:'rgba(255,255,255,.3)'};return '<span class="pba" style="background:'+st.bg+';color:'+st.tx+';border-color:'+st.br+'">'+(s||'&mdash;')+'</span>';}
function cert(c){if(!c||c=='&mdash;'||c=='-')return '<span class="kno">&mdash;</span>';if(c=='Voltooid'||c=='Voltooid (Equivalent)')return '<span class="kok">&#10003; Voltooid</span>';if(c=='Goedgekeurd')return '<span class="kbl">&#10003; Goedgekeurd</span>';if(c=='In behandeling')return '<span class="kpe">&#8987; In beh.</span>';return '<span class="kno">'+c+'</span>';}
function tc2(t){if(t=='Event')return 'tEv';if(t=='e-Learning')return 'tEL';if(t=='Test')return 'tTe';return 'tEv';}
function tic(t){if(t=='Event')return '&#127891;';if(t=='e-Learning')return '&#128187;';if(t=='Test')return '&#128221;';return '&#128203;';}
function tog(id){var b=document.getElementById(id);var c=document.getElementById('cv-'+id);if(!b)return;var col=b.classList.toggle('col');c.textContent=col?'&#9658;':'&#9660;';}
function rcard(u,pf,sf){
  var vc=VC[u.divisie]||{bg:'#eeecea',tx:'#555'};
  var av=ini(u.naam);
  var progs=u.programmas||[];
  if(pf)progs=progs.filter(function(p){return p.titel==pf;});
  if(sf)progs=progs.filter(function(p){return p.prog_status==sf||(p.trainingen||[]).some(function(t){return t.status==sf;});});
  if(!progs.length)return '';
  var ph='';
  for(var i=0;i<progs.length;i++){
    var p=progs[i];
    var tr=p.trainingen||[];
    var vn=tr.filter(function(t){return t.status=='Voltooid'||t.status=='Voltooid (Equivalent)';}).length;
    var pct=tr.length?Math.round(vn/tr.length*100):0;
    var pid='p'+u.id.replace(/[^a-zA-Z0-9]/g,'x')+i;
    var rows='';
    for(var j=0;j<tr.length;j++){
      var t=tr[j];
      rows+='<tr><td>'+tic(t.type)+' <strong>'+t.titel+'</strong></td><td><span class="tb '+tc2(t.type)+'">'+t.type+'</span></td><td class="dc">'+(t.reg_datum||'&mdash;')+'</td><td>'+spill(t.status)+'</td><td class="hc">'+(t.uren?t.uren+'u':'&mdash;')+'</td><td class="dc">'+(t.voltdatum||'&mdash;')+'</td><td>'+cert(t.cert)+'</td></tr>';
    }
    var sum=p.prog_cert?'<div class="psm"><span>Programma cert: <strong>'+p.prog_cert+'</strong></span>'+(p.prog_reg?'<span>Geregistreerd: <strong>'+p.prog_reg+'</strong></span>':'')+(p.prog_einddatum?'<span>Deadline: <strong>'+p.prog_einddatum+'</strong></span>':'')+'</div>':'';
    ph+='<div class="pb"><div class="ph" onclick="tog(\''+pid+'\')"><div class="pt">&#128203; '+p.titel+' <span style="font-size:11px;opacity:.7">('+tr.length+' trainingen)</span></div><div class="pm">'+(p.prog_status?pbadge(p.prog_status):'')+(p.prog_uren?'<span class="ps"><strong>'+p.prog_uren+'u</strong></span>':'')+(p.prog_einddatum?'<span class="ps">Deadline: <strong>'+p.prog_einddatum+'</strong></span>':'')+'<span class="ps">'+vn+'/'+tr.length+' ('+pct+'%)</span><span class="cv" id="cv-'+pid+'">&#9660;</span></div></div><div class="pbd" id="'+pid+'"><table><thead><tr><th>Training</th><th>Type</th><th>Registratie</th><th>Status</th><th>Uren</th><th>Voltooid op</th><th>Certificering</th></tr></thead><tbody>'+rows+'</tbody></table>'+sum+'</div></div>';
  }
  return '<div class="card"><div class="ch"><div style="display:flex;align-items:center;gap:10px;flex:1"><div class="av">'+av+'</div><div><div class="cn">'+u.naam+'</div><div class="cs">'+u.id+' &middot; '+u.divisie+'</div></div></div><span class="vb" style="background:'+vc.bg+';color:'+vc.tx+'">'+u.divisie+'</span></div>'+ph+'</div>';
}
function fu(){
  var q=document.getElementById('sq').value.toLowerCase().trim();
  var v=document.getElementById('sv').value;
  var pf=document.getElementById('sp').value;
  var sf=document.getElementById('ss').value;
  return USERS.filter(function(u){
    if(v&&u.divisie!=v)return false;
    if(pf&&!(u.programmas||[]).some(function(p){return p.titel==pf;}))return false;
    if(sf&&!(u.programmas||[]).some(function(p){return p.prog_status==sf||(p.trainingen||[]).some(function(t){return t.status==sf;});}))return false;
    if(!q)return true;
    var h=[u.naam,u.id,u.divisie].concat((u.programmas||[]).map(function(p){return [p.titel].concat((p.trainingen||[]).map(function(t){return t.titel;})).join(' ');})).join(' ').toLowerCase();
    return h.indexOf(q)>=0;
  });
}
function render(){
  var pf=document.getElementById('sp').value;
  var sf=document.getElementById('ss').value;
  var res=fu();
  var el=document.getElementById('out');
  var st=document.getElementById('stats');
  if(!res.length){el.innerHTML='<div class="nr">Geen gebruikers gevonden.</div>';st.textContent='';return;}
  var h=res.map(function(u){return rcard(u,pf,sf);}).filter(Boolean).join('');
  el.innerHTML=h||'<div class="nr">Geen resultaten.</div>';
  st.textContent=res.length+' gebruiker'+(res.length!=1?'s':'')+' gevonden';
}
function rbf(){
  var vs=document.getElementById('sv');var ps=document.getElementById('sp');var ss=document.getElementById('ss');
  vs.innerHTML='<option value="">Alle vestigingen</option>';
  ps.innerHTML='<option value="">Alle programmas</option>';
  ss.innerHTML='<option value="">Alle statussen</option>';
  var vset=[];var pset=[];var sset=[];
  USERS.forEach(function(u){if(vset.indexOf(u.divisie)<0)vset.push(u.divisie);(u.programmas||[]).forEach(function(p){if(pset.indexOf(p.titel)<0)pset.push(p.titel);if(p.prog_status&&sset.indexOf(p.prog_status)<0)sset.push(p.prog_status);(p.trainingen||[]).forEach(function(t){if(t.status&&sset.indexOf(t.status)<0)sset.push(t.status);});});});
  vset.sort().forEach(function(v){var o=document.createElement('option');o.value=v;o.text=v;vs.appendChild(o);});
  pset.sort().forEach(function(p){var o=document.createElement('option');o.value=p;o.text=p;ps.appendChild(o);});
  sset.sort().forEach(function(s){var o=document.createElement('option');o.value=s;o.text=s;ss.appendChild(o);});
}
function load(users,lbl){USERS=users;document.getElementById('dlbl').textContent=lbl;document.getElementById('tc').textContent=users.length+' gebruikers';rbf();render();toast(users.length+' gebruikers geladen');}
function fdate(d){if(!d)return '';var s=String(d).trim();if(s.length>=10){var p=s.substring(0,10).split('-');if(p.length==3)return p[2]+'/'+p[1]+'/'+p[0];}return s;}
function pxl(ab){
  var wb=XLSX.read(ab,{type:'arraybuffer'});
  var ws=wb.Sheets[wb.SheetNames[0]];
  var raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  
  // Find header row - look for exact 'Gebruikers-ID' in any cell
  var hi=-1;
  for(var i=0;i<raw.length;i++){
    for(var j=0;j<raw[i].length;j++){
      if(String(raw[i][j]).trim()==='Gebruikers-ID'){hi=i;break;}
    }
    if(hi>=0) break;
  }
  if(hi<0) throw new Error('Headers niet gevonden. Controleer of dit het juiste rapport is.');
  
  var hdrs=raw[hi].map(function(v){return String(v).trim();});
  
  // Find Gebruikers-ID column - anchor point
  var cUid=-1;
  for(var j=0;j<hdrs.length;j++){if(hdrs[j]==='Gebruikers-ID'){cUid=j;break;}}
  
  // Dynamic column finder - search from anchor onwards
  function col(name,start){
    var s=start!==undefined?start:cUid;
    for(var j=s;j<hdrs.length;j++){if(hdrs[j].toLowerCase().indexOf(name.toLowerCase())>=0)return j;}
    return -1;
  }
  
  var cNaam = col('Volledige naam gebruiker', cUid+1);
  var cCgrp = col('Commercial Group',         cUid+1);
  var cDiv  = col('Divisie',                  cUid+1);
  var cProg = col('Trainingsprogramma',       cUid+1);
  var cTit  = col('Titel training',           cUid);
  var cTyp  = col('Trainingstype',            cUid);
  var cReg  = col('Registratiedatum',         cUid);
  var cStat = col('Status trainingsoverzicht',cUid);
  var cUur  = col('Trainingsuren',            cUid);
  var cVolt = col('Voltooiingsdatum',         cUid);
  var cEind = col('Einddatum',                cUid);
  var cCert = col('Certification Status',     cUid);
  
  var DMAP={'Autobedrijf Deckx-Team':'Autobedrijf Deckx-Team','Autobedrijf Deckx-Team NV':'Autobedrijf Deckx-Team','Garage Verellen':'Garage Verellen Geel','Verellen':'Garage Verellen Geel','Liers Auto Center':'Liers Auto Center','Garage Verschaeren':'Garage Verschaeren','Hermans NV':'Hermans Herentals','DE MOBILITEITSMAKELAAR':'DE MOBILITEITSMAKELAAR'};
  
  function g(r,i){if(i<0||i>=r.length)return '';var v=r[i];return(v===null||v===undefined||String(v)==='nan')?'':String(v).trim();}
  function fd(v){if(!v||v==='nan')return '';var s=String(v).substring(0,10);var p=s.replace(/\//g,'-').split('-');if(p.length===3){if(p[0].length===4)return p[2]+'/'+p[1]+'/'+p[0];return p[0]+'/'+p[1]+'/'+p[2];}return s;}
  
  var users={};
  for(var i=hi+1;i<raw.length;i++){
    var r=raw[i];
    var uid=g(r,cUid);if(!uid)continue;
    var naam=g(r,cNaam);var cgrp=g(r,cCgrp);var rawDiv=g(r,cDiv);
    var divisie=DMAP[rawDiv]||rawDiv;
    var prog=g(r,cProg);var titel=g(r,cTit);var typ=g(r,cTyp);
    var reg=fd(g(r,cReg));var stat=g(r,cStat);var uur=g(r,cUur);
    var volt=fd(g(r,cVolt));var eind=fd(g(r,cEind));var cert=g(r,cCert);
    if(!users[uid])users[uid]={id:uid,naam:naam,divisie:divisie,comm_grp:cgrp,programmas:{}};
    if(!users[uid].programmas[prog])users[uid].programmas[prog]={titel:prog,trainingen:[],prog_status:'',prog_uren:'',prog_einddatum:'',prog_cert:'',prog_reg:''};
    if(typ==='Trainingsprogramma'){
      var p=users[uid].programmas[prog];
      p.prog_status=stat;p.prog_uren=uur;p.prog_einddatum=eind;p.prog_cert=cert;p.prog_reg=reg;
    }else if(titel&&titel!=='-'){
      users[uid].programmas[prog].trainingen.push({titel:titel,type:typ,reg_datum:reg,status:stat,uren:uur,voltdatum:volt,einddatum:eind,cert:cert});
    }
  }
  return Object.values(users).map(function(u){return Object.assign({},u,{programmas:Object.values(u.programmas)});}).sort(function(a,b){return a.divisie.localeCompare(b.divisie)||(a.naam||'').localeCompare(b.naam||'');});
}
function hfile(f){
  if(!f||(!f.name.endsWith('.xlsx')&&!f.name.endsWith('.xls'))){toast('Selecteer .xlsx');return;}
  slov('Verwerken...');var rd=new FileReader();
  rd.onload=function(e){try{var u=pxl(e.target.result);if(!u.length)throw new Error('Geen data.');var d=new Date();var dt=String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();load(u,'Bijgewerkt: '+f.name+' ('+dt+')');}catch(er){toast('Fout: '+er.message);}finally{hlod();}};
  rd.readAsArrayBuffer(f);
}
var rz=document.getElementById('rz');
rz.addEventListener('dragover',function(e){e.preventDefault();rz.classList.add('over');});
rz.addEventListener('dragleave',function(){rz.classList.remove('over');});
rz.addEventListener('drop',function(e){e.preventDefault();rz.classList.remove('over');hfile(e.dataTransfer.files[0]);});
document.getElementById('fi').addEventListener('change',function(e){hfile(e.target.files[0]);});
document.getElementById('sq').addEventListener('input',render);
document.getElementById('sv').addEventListener('change',render);
document.getElementById('sp').addEventListener('change',render);
document.getElementById('ss').addEventListener('change',render);
function slov(m){document.getElementById('omsg').textContent=m;document.getElementById('ov').classList.add('sh');}
function hlod(){document.getElementById('ov').classList.remove('sh');}
function toast(m){var t=document.getElementById('ts');t.textContent=m;t.classList.add('sh');setTimeout(function(){t.classList.remove('sh');},3000);}
// Embedded data
